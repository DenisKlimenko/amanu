name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build and verify LocalVQE assets
        run: make verify-localvqe
      - name: Swift tests
        # The native echo test occupies CPU workers for tens of seconds.
        # Keep unrelated suites from starving bounded async transport tests;
        # concurrency exercised inside each test remains unchanged.
        run: swift test --no-parallel
        env:
          # The assets were built in the step above, so the tests that use
          # them run here whether or not they are found: a missing asset is
          # a failure on CI rather than the skip it is on a fresh checkout.
          AMANU_REQUIRE_LOCALVQE: "1"
      - name: Universal release build
        run: make build
      - name: Landing checks
        run: python3 landing/tests/check.py
      - name: Release-script tests
        run: python3 -m unittest discover -s Tests/scripts -p 'test_*.py'
